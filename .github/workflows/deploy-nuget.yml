name: deploy-prod
on:
  push:
    branches:
      - main
    # tags:
    #   - 'v*.*.*'  # Trigger only on version tags like v1.0.0, v2.1.3, etc.

jobs:
  deploy-prod:
    name: "Deploy nuget"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack
        run: |
           dotnet nuget add source --username BUILD --password ${{secrets.NUGET_TOKEN}} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/SimonRiis/index.json"
           dotnet pack . -c Release
           
      - name: Publish to GitHub packages 
        run: dotnet nuget push src/domain/bin/Release/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }}  --source "github" --skip-duplicate